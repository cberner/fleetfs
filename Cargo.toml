[package]
name = "fleetfs"
description = "FleetFS"
license = "Apache-2.0"
repository = "https://github.com/fleetfs/fleetfs"
version = "0.2.0"
authors = ["Christopher Berner <christopherberner@gmail.com>"]
edition = "2024"
rust-version = "1.97"
exclude = ["*.sh", "cloud_benchmark/"]

[dependencies]
futures = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ['codec'] }
tokio = { version = "1.53", features = ['io-util', 'time', 'rt-multi-thread', 'net'] }
clap = { version = "4.6", features = ["cargo"] }
log = "0.4"
env_logger = "0.11"
fuser = "0.18"
zerialize = "0.0.1"
redb = "4.2"
redb-derive = "0.1"
libc = "0.2"
byteorder = "1.5"
sha2 = "0.11"
walkdir = "2.5"
raxos = "0.0.1"
rand = "0.10"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
debug = true
