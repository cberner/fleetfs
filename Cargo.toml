[package]
name = "fleetfs"
description = "FleetFS"
license = "Apache-2.0"
repository = "https://github.com/fleetfs/fleetfs"
version = "0.2.0"
authors = ["Christopher Berner <christopherberner@gmail.com>"]
edition = "2024"
rust-version = "1.97"
exclude = ["*.sh", "cloud_benchmark/"]

[dependencies]
futures = "0.3"
futures-util = "0.3.8"
tokio-util = { version = "0.7.0", features = ['codec'] }
tokio = { version = "1.28", features = ['io-util', 'time', 'rt-multi-thread', 'net'] }
clap = { version = "4.4.6", features = ["cargo"] }
log = "0.4"
env_logger = "0.11.5"
fuser = "0.17.0"
zerialize = "0.0.1"
redb = "3.0.0"
redb-derive = "0.1.0"
libc = "0.2"
byteorder = "1.3"
sha2 = "0.10"
walkdir = "2.3"
raxos = "0.0.1"
rand = "0.9"

[dev-dependencies]
tempfile = "3.1"

[profile.release]
debug = true
